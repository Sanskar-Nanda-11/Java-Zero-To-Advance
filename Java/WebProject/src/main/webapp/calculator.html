<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Insert Two Value To Do The Operations</title>
<style type="text/css">
	body{
		height:100vh;
		display:flex;
		margin:auto;
		align-items:center;
		justify-content:center;
	}
	
	label{
		font-size:20px;
	}
	
	button{
		padding:15px 30px;
		margin-left:5px;
		border:none;
		background-color:slateblue;
		border-radius:50px;
		color:white;
		font-size:20px;
	}
	input[type="number"]{
	   	height:40px;
	   	width:200px;
	   	font-size:40px;
	}
	button:hover{
		cursor:pointer;
		background-color:blue;
	}
	.form-field{
		display:flex;
		flex-direction:column;
		justify-content:space-around;
	}
</style>
</head>
<body>
<form method="POST" action="calculator">
	<div class="form-field">
	<div>
		<label>Enter your first number : </label>
		<!--  name attribute is what the servlet uses to get the value -->
		<input type="number" name="num1"/>
	</div>
	<div>
		<label>Enter your second number : </label>
		<input type="number" name="num2"/>
	</div>
	<div>
		<button type="submit" name = "operation" value="add">+</button>
		<button type="submit" name = "operation" value="subtract">-</button>
		<button type="submit" name = "operation" value="multiply">x</button>
		<button type="submit" name = "operation" value="divide">/</button>
	</div>
	</div>
</form>
</body>
</html>
